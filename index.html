<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="theme-color" content="#1e8449"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><title>Coach Basket (nome provvisorio)</title>
<style>
:root{--bg:#f2f3f5;--sf:#fff;--tx:#14171c;--mu:#5a6472;--ln:#d6dae0;--ac:#d9480f;--ac2:#fff;--dg:#c92a2a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1216;--sf:#1a2027;--tx:#eef1f4;--mu:#a0abb8;--ln:#2d3640;--ac:#ff8a3d;--ac2:#1b1209;--dg:#ff7b7b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1216;--sf:#1a2027;--tx:#eef1f4;--mu:#a0abb8;--ln:#2d3640;--ac:#ff8a3d;--ac2:#1b1209;--dg:#ff7b7b;color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);font-size:clamp(16px,1.1vw + 8px,21px)}
html[data-size="m"]{font-size:17px}html[data-size="l"]{font-size:21px}
body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:1rem/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{display:flex;height:100%}
nav{display:flex;flex-direction:column;gap:.3rem;padding:.75rem;background:var(--sf);border-right:1px solid var(--ln);width:9.5rem;flex:none}
nav button{display:flex;align-items:center;gap:.6rem;min-height:3rem;padding:.4rem .7rem;border:0;border-radius:.6rem;background:none;color:var(--tx);font:inherit;font-weight:600;cursor:pointer}
nav button.on{background:var(--ac);color:var(--ac2)}
main{flex:1;min-width:0;overflow:auto;padding:1rem 1.25rem}
h1{margin:0 0 .8rem;font-size:1.6rem}h2{margin:.2rem 0;font-size:1.25rem}h3{margin:0 0 .5rem;font-size:1.05rem}
.btn{min-height:2.75rem;padding:.5rem 1rem;border-radius:.6rem;border:1px solid var(--ln);background:var(--sf);color:var(--tx);font:inherit;font-weight:600;cursor:pointer}
.btn.p{background:var(--ac);color:var(--ac2);border-color:transparent}.btn.d{color:var(--dg)}.btn:disabled{opacity:.5;cursor:default}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:.8rem;padding:1rem;margin-bottom:.8rem}
input,textarea,select{width:100%;min-height:2.75rem;padding:.5rem .7rem;border:1px solid var(--ln);border-radius:.6rem;background:var(--bg);color:var(--tx);font:inherit;box-sizing:border-box}
label{display:block;font-size:.85rem;color:var(--mu);margin:.7rem 0 .25rem}
.row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}.mu{color:var(--mu)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:1rem;align-items:start}
.it{display:flex;align-items:center;gap:.7rem;padding:.6rem;border-radius:.6rem;border:1px solid transparent;cursor:pointer}.it.on{border-color:var(--ac);background:var(--bg)}
.num{min-width:2.4rem;height:2.4rem;border-radius:50%;background:var(--ac);color:var(--ac2);display:grid;place-items:center;font-weight:800}
.tag{font-size:.78rem;padding:.1rem .55rem;border-radius:1rem;background:var(--bg);border:1px solid var(--ln);color:var(--mu)}
.grid.eq{grid-template-columns:repeat(2,minmax(0,1fr))}.pal{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--ln);padding:.5rem 0 calc(.4rem + env(safe-area-inset-bottom,0px));margin-top:.6rem;display:flex;flex-wrap:wrap;gap:4px;justify-content:center;z-index:5}.pal .chip{flex:1 1 0;min-width:48px;max-width:84px;min-height:3rem;font-size:.9rem;padding:0 1px}.pal .chip small{font-size:.55rem;text-align:center;line-height:1.05;max-width:100%}.strip .btn{padding:.3rem .55rem;font-size:.85rem;min-height:2.6rem}.bk{display:none}.chip{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:5.5rem;min-height:4.2rem;border-radius:.8rem;background:var(--ac);color:var(--ac2);font-size:1.4rem;font-weight:800;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}.chip small{font-size:.7rem;font-weight:600}button.chip{border:0;font-family:inherit}.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(5.2rem,1fr));gap:.5rem}#app.bd nav{display:none}.tile{border:2px solid var(--ac);border-radius:.8rem;padding:.5rem;display:flex;flex-direction:column;align-items:center;text-align:center;gap:.1rem;cursor:pointer;min-height:4.2rem;background:var(--sc,var(--bg));color:var(--sc2,var(--tx))}.tile .mu{color:inherit;opacity:.75;font-size:.78rem;white-space:nowrap}.sw{width:2.2rem;height:2.2rem;border-radius:.5rem;border:2px solid var(--ln);cursor:pointer;padding:0}.tile .tn{font-size:1.5rem;font-weight:800;line-height:1.1}.tile .tm{font-weight:600;font-size:.9rem;word-break:break-word}.tb{width:100%;border-collapse:collapse}.tb th,.tb td{padding:.4rem .5rem;border-bottom:1px solid var(--ln);text-align:left;white-space:nowrap}.sec.off{display:none}@media print{:root:root:root{--bg:#fff;--sf:#fff;--tx:#000;--mu:#444;--ln:#bbb}nav,.noprint{display:none!important}html,body,#app,main{display:block;height:auto;overflow:visible}.sec.off{display:block!important}.card{border:0}}.chip.x{background:var(--sf);color:var(--tx);border:2px solid var(--ln)}.chip.f{background:var(--dg);color:var(--ac2)}.chip.on{outline:4px solid var(--tx)}.tile.w4{background:#ffe066;color:#111;border-color:#e67700}.tile.w4 .mu{color:#111}.sl{outline:3px solid var(--ac)}.dz{outline:3px solid var(--ac);background:var(--bg)}#un{position:fixed;left:50%;bottom:calc(1rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:.5rem .6rem .5rem 1rem;border-radius:.7rem;display:none;align-items:center;gap:.8rem;z-index:30;max-width:calc(100% - 2rem)}#un button{min-height:2.5rem;border:0;border-radius:.5rem;padding:.3rem .9rem;font:inherit;font-weight:700;background:var(--ac);color:var(--ac2);cursor:pointer}.gate{min-height:100%;display:grid;place-items:center}.gate .card{width:min(26rem,100%);text-align:center;padding:2rem 1.5rem;margin:0}.gate h1{font-size:2rem;margin:.2rem 0 1rem}.gate .big{font-size:3rem;margin:0}
#md{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:calc(1rem + env(safe-area-inset-top,0px)) 1rem calc(1rem + env(safe-area-inset-bottom,0px));z-index:20}
.box{background:var(--sf);border-radius:1rem;padding:1.2rem;width:min(30rem,100%);max-height:100%;overflow:auto;box-sizing:border-box}
#ts{position:fixed;left:50%;bottom:calc(1rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:.6rem 1rem;border-radius:.6rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
@media (max-width:760px){.grid{grid-template-columns:1fr}.grid.sel .lst{display:none}.grid:not(.sel) .det{display:none}.bk{display:inline-flex;align-items:center}
#app{flex-direction:column-reverse}nav{flex-direction:row;width:auto;border-right:0;border-top:1px solid var(--ln);justify-content:space-around;padding:.4rem}nav button{flex-direction:column;gap:.1rem;font-size:.8rem;min-height:2.8rem}}
</style>
</head>
<body>
<div id="app"></div><div id="md"></div><div id="ts"></div><div id="un"></div>
<script>
(function(){
const KEY='coachbasket_v1';
const def=()=>({v:1,profile:null,seasons:[],teams:[],games:[],settings:{size:'auto',theme:'auto',sound:false,lastBackup:null,c1:'#1e8449',c2:'#ffffff',pick:'sheet'}});
let S=def(),UI={tab:'home',team:null,q:''},memOK=true,LOGGED=false;
try{const r=localStorage.getItem(KEY);if(r){S=Object.assign(def(),JSON.parse(r));S.settings=Object.assign(def().settings,S.settings)}}catch(e){memOK=false}
const sync=()=>{try{S.games.forEach(g=>['h','a'].forEach(s=>{const sd=g.side[s],t=S.teams.find(x=>x.id===sd.tid);if(!t)return;sd.name=t.name;sd.pl.forEach(p=>{const a=t.players.find(x=>x.id===p.id);if(a){p.nm=((a.name||'')+' '+(a.surname||'')).trim();p.num=a.num}})}))}catch(e){}};
const save=()=>{sync();try{localStorage.setItem(KEY,JSON.stringify(S));memOK=true;return true}catch(e){memOK=false;try{toast('ATTENZIONE: dati non salvati sul dispositivo.')}catch(_){}return false}};
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const myTeam=()=>S.teams.find(t=>t.mine),seasonA=()=>S.seasons.find(s=>s.active);
const getT=id=>S.teams.find(t=>t.id===id);
function toast(t){const e=$('#ts');e.textContent=t;e.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.opacity=0,2600)}
function close(){const m=$('#md');m.style.display='none';m.innerHTML=''}
function form(title,body,ok,label){
 const m=$('#md');
 m.innerHTML=`<form class="box"><h3>${title}</h3>${body}<p class="er" style="color:var(--dg);min-height:1.3em;margin:.5rem 0"></p><div class="row" style="justify-content:flex-end"><button type="button" class="btn" data-a="close">Annulla</button><button class="btn p">${label||'Salva'}</button></div></form>`;
 m.style.display='flex';
 const f=m.querySelector('form');
 f.onsubmit=e=>{e.preventDefault();const er=ok(Object.fromEntries(new FormData(f)));if(er)f.querySelector('.er').textContent=er;else close()};
 const i=f.querySelector('input,textarea');if(i)i.focus();
}
function ask(msg,yes,label){
 const m=$('#md');
 m.innerHTML=`<div class="box"><p style="margin-top:0">${msg}</p><div class="row" style="justify-content:flex-end"><button class="btn" data-a="close">Annulla</button><button class="btn p" id="yes">${label||'Conferma'}</button></div></div>`;
 m.style.display='flex';$('#yes').onclick=()=>{close();yes()};
}
function render(){
 const r=document.documentElement;
 r.dataset.size=S.settings.size;
 if(S.settings.theme==='auto')delete r.dataset.theme;else r.dataset.theme=S.settings.theme;
 const st=S.settings,rs=r.style;
 if(st.c1){rs.setProperty('--ac',st.c1);rs.setProperty('--ac2',lum(st.c1)>.4?'#111':'#fff')}else{rs.removeProperty('--ac');rs.removeProperty('--ac2')}
 if(st.c2){rs.setProperty('--sc',st.c2);rs.setProperty('--sc2',lum(st.c2)>.4?'#111':'#fff')}else{rs.removeProperty('--sc');rs.removeProperty('--sc2')}
 const a=$('#app'),keep=$('main')?$('main').scrollTop:null;if(UI.tab!=='game')UI.arm=null;
 if(!S.profile||!S.profile.coach){a.innerHTML='<main>'+gate('reg')+'</main>';return}
 if(!LOGGED){a.innerHTML='<main>'+gate('in')+'</main>';return}
 if(!S.teams.length){a.innerHTML='<main>'+onboard()+'</main>';return}
 const tabs=[['home','🏀','Partite'],['teams','👥','Squadre'],['seasons','📅','Stagioni'],['stats','📊','Statistiche'],['set','⚙️','Opzioni']];
 const v={home:vHome,teams:vTeams,seasons:vSeasons,set:vSet,setup:vSetup,game:vGame,log:vLog,sum:vSum,stats:vStats,board:vBoard}[UI.tab]();
 a.className=UI.tab==='board'?'bd':'';a.innerHTML='<nav>'+tabs.map(t=>`<button class="${UI.tab===t[0]?'on':''}" data-a="tab" data-id="${t[0]}"><span>${t[1]}</span>${t[2]}</button>`).join('')+'</nav><main>'+(memOK?'':'<div class="card" style="color:var(--dg)">La memoria del browser non è disponibile: i dati non verranno salvati.</div>')+v+'</main>';if(keep!=null&&$('main'))$('main').scrollTop=keep;wake(UI.tab==='game'||UI.tab==='board');
}
function gate(m){
 if(m==='reg')return `<div class="gate"><div class="card"><p class="big">🏀</p><h1>Registrazione</h1><p class="mu">Inserisci il tuo nome. I dati restano su questo dispositivo.</p><form id="rg"><input name="coach" required maxlength="40" placeholder="Il tuo nome" style="text-align:center"><p style="margin:1rem 0 0"><button class="btn p" style="width:100%">Registrati</button></p></form></div></div>`;
 return `<div class="gate"><div class="card"><p class="big">🏀</p><p class="mu" style="margin:0">Bentornato</p><h1>${esc(S.profile.coach)}</h1>${S.settings.pin?'<input id="pin" type="password" inputmode="numeric" maxlength="4" placeholder="PIN" style="text-align:center;margin-bottom:.8rem">':''}<button class="btn p" data-a="enter" style="width:100%">Entra</button><p style="margin:.8rem 0 0"><button class="btn" data-a="editProf">Cambia nome</button></p></div></div>`;
}
function onboard(){return `<div class="card" style="max-width:34rem;margin:2rem auto"><h1>Crea la tua squadra</h1><p class="mu">Inserisci la tua squadra e, se vuoi, i nomi dello staff.</p><form id="ob"><label>Nome della tua squadra</label><input name="team" required maxlength="40"><label>Stagione in corso</label><input name="season" value="2026/27" required maxlength="20">${coachFields()}<p style="margin:1rem 0 0"><button class="btn p" style="width:100%">Inizia</button></p></form></div>`}
function vHome(){
 const s=seasonA(),m=myTeam(),opp=S.teams.filter(t=>!t.mine).length,np=S.teams.reduce((n,t)=>n+t.players.length,0);
 const old=!S.settings.lastBackup||Date.now()-S.settings.lastBackup>30*864e5;
 return `<h1>${myTeam()?esc(myTeam().name):'Partite'}</h1>
 <div class="card"><h3>Nuova partita</h3><p class="mu">Scegli l’avversario, i convocati e i titolari, poi inizia.</p><button class="btn p" data-a="newG">Nuova partita</button></div>${gamesCard()}
 <div class="row" style="align-items:stretch"><div class="card" style="flex:1;min-width:11rem"><span class="tag">Stagione attiva</span><h2>${s?esc(s.name):'Nessuna'}</h2></div>
 <div class="card" style="flex:1;min-width:11rem"><span class="tag">${m?esc(m.name):'La tua squadra'}</span><h2>${m?m.players.length:0} giocatori</h2></div>
 <div class="card" style="flex:1;min-width:11rem"><span class="tag">Avversarie in archivio</span><h2>${opp}</h2></div></div>
 ${np>0&&old?'<div class="card"><h3>Fai un backup</h3><p class="mu">Sono passati più di 30 giorni dall’ultimo backup (o non ne hai ancora fatto uno). Lo trovi in Opzioni.</p><button class="btn p" data-a="tab" data-id="set">Vai alle opzioni</button></div>':''}`;
}
const sorted=()=>[...S.teams].sort((a,b)=>(b.mine?1:0)-(a.mine?1:0)||a.name.localeCompare(b.name,'it'));
function teamList(){
 const q=UI.q.trim().toLowerCase();
 return sorted().filter(t=>t.name.toLowerCase().includes(q)).map(t=>`<div class="it ${UI.team===t.id?'on':''}" data-a="pick" data-id="${t.id}"><div style="flex:1;min-width:0"><b>${esc(t.name)}</b><div class="mu" style="font-size:.85rem">${t.players.length} giocatori</div></div>${t.mine?'<span class="tag">La mia</span>':''}</div>`).join('')||'<p class="mu">Nessuna squadra trovata.</p>';
}
function vTeams(){
 const t=getT(UI.team);
 return `<h1>Squadre</h1><div class="grid ${t?'sel':''}"><div class="lst card"><div class="row"><input id="q" placeholder="Cerca squadra" value="${esc(UI.q)}" style="flex:1;min-width:8rem"><button class="btn p" data-a="addTeam">+ Squadra</button></div><div id="tl" style="margin-top:.6rem">${teamList()}</div></div><div class="det">${t?roster(t):'<div class="card mu">Seleziona una squadra per vedere la rosa.</div>'}</div></div>`;
}
function roster(t){
 const pl=[...t.players].sort((a,b)=>Number(a.num)-Number(b.num)||a.num.localeCompare(b.num));
 return `<div class="card"><div class="row"><button class="btn bk" data-a="back">‹ Indietro</button><h2 style="flex:1;margin:0">${esc(t.name)}</h2><button class="btn" data-a="editTeam" data-id="${t.id}">Modifica</button>${t.mine?'':`<button class="btn d" data-a="delTeam" data-id="${t.id}">Elimina</button>`}</div>
 ${t.mine?coachLine(t):''}<p class="mu">${pl.length} giocatori. ${t.mine?'Puoi registrare quanti giocatori vuoi: a inizio partita ne convochi al massimo 12.':'Per gli avversari basta il numero di maglia. Puoi registrare quanti giocatori vuoi: a inizio partita ne convochi al massimo 12.'}</p>
 <button class="btn p" data-a="addPl" data-id="${t.id}">+ Giocatore</button>
 <div style="margin-top:.6rem">${pl.map(p=>`<div class="it" style="cursor:default"><span class="num">${esc(p.num)}</span><div style="flex:1;min-width:0"><b>${esc(((p.name||'')+' '+(p.surname||'')).trim()||'Senza nome')}</b>${t.mine&&(p.birth||p.note)?`<div class="mu" style="font-size:.85rem">${p.birth?'Anno '+esc(p.birth):''}${p.birth&&p.note?' · ':''}${esc(p.note)}</div>`:''}</div><button class="btn" data-a="editPl" data-id="${t.id}" data-p="${p.id}">Modifica</button><button class="btn d" data-a="delPl" data-id="${t.id}" data-p="${p.id}">✕</button></div>`).join('')||'<p class="mu">Nessun giocatore: aggiungine uno.</p>'}</div></div>`;
}
function plForm(t,p){
 const m=t.mine;
 form(p?'Modifica giocatore':'Nuovo giocatore',
 `<label>Numero di maglia (0–99)</label><input name="num" inputmode="numeric" maxlength="2" required value="${esc(p?p.num:'')}"><label>Nome${m?'':' (facoltativo)'}</label><input name="name" maxlength="30" ${m?'required':''} value="${esc(p?p.name:'')}"><label>Cognome${m?'':' (facoltativo)'}</label><input name="surname" maxlength="30" ${m?'required':''} value="${esc(p?p.surname:'')}">`+(m?`<label>Anno di nascita</label><input name="birth" inputmode="numeric" maxlength="4" value="${esc(p?p.birth:'')}"><label>Note dell’allenatore</label><textarea name="note" rows="3" maxlength="300">${esc(p?p.note:'')}</textarea>`:''),
 d=>{
  const n=(d.num||'').trim();
  if(!/^\d{1,2}$/.test(n))return 'Il numero deve essere tra 0 e 99.';
  if(t.players.some(x=>x.num===n&&(!p||x.id!==p.id)))return 'Esiste già un giocatore con il numero '+n+'.';
  if(d.birth&&d.birth.trim()&&!/^(19|20)\d\d$/.test(d.birth.trim()))return 'Anno di nascita non valido.';
  const o={num:n,name:(d.name||'').trim(),surname:(d.surname||'').trim(),birth:(d.birth||'').trim(),note:(d.note||'').trim()};
  if(p)Object.assign(p,o);else t.players.push(Object.assign({id:uid()},o));
  save();render();
 });
}
const CL=['Allenatore','Vice allenatore','Terzo allenatore'];
const coachFields=t=>CL.map((l,i)=>`<label>${l} (facoltativo)</label><input name="c${i+1}" maxlength="40" value="${esc(t&&t.coaches?t.coaches[i]:'')}">`).join('');
const coachLine=t=>{const c=(t.coaches||[]).map((n,i)=>n?`${CL[i]}: <b>${esc(n)}</b>`:'').filter(Boolean);return `<p class="mu" style="margin:.4rem 0">${c.length?c.join(' · '):'Allenatori non inseriti: usa “Modifica”.'}</p>`};
function teamForm(t){
 form(t?'Modifica squadra':'Nuova squadra',`<label>Nome della squadra</label><input name="name" required maxlength="40" value="${esc(t?t.name:'')}">`+(t&&t.mine?coachFields(t):''),d=>{
  const n=(d.name||'').trim();
  if(!n)return 'Inserisci un nome.';
  if(S.teams.some(x=>x.name.toLowerCase()===n.toLowerCase()&&(!t||x.id!==t.id)))return 'Esiste già una squadra con questo nome.';
  const cs=[d.c1,d.c2,d.c3].map(x=>(x||'').trim());if(t){t.name=n;if(t.mine)t.coaches=cs}else{const nt={id:uid(),name:n,mine:false,players:[]};S.teams.push(nt);UI.team=nt.id}
  save();render();
 });
}
function vSeasons(){
 return `<h1>Stagioni</h1><div class="card"><button class="btn p" data-a="addSe">+ Stagione</button><div style="margin-top:.6rem">${S.seasons.map(s=>`<div class="it" style="cursor:default"><b style="flex:1">${esc(s.name)}</b>${s.active?'<span class="tag">Attiva</span>':`<button class="btn" data-a="actSe" data-id="${s.id}">Attiva</button>`}<button class="btn" data-a="seSt" data-id="${s.id}">Statistiche</button><button class="btn" data-a="renSe" data-id="${s.id}">Rinomina</button>${s.active?'':`<button class="btn d" data-a="delSe" data-id="${s.id}">✕</button>`}</div>`).join('')}</div><p class="mu">Le statistiche mostrate sono sempre quelle della stagione attiva; quelle delle altre stagioni restano memorizzate e le rivedi attivandole.</p></div>`;
}
function seForm(s){
 form(s?'Rinomina stagione':'Nuova stagione',`<label>Nome (es. 2027/28)</label><input name="name" required maxlength="20" value="${esc(s?s.name:'')}">`+(s?'':'<label class="row" style="color:var(--tx)"><input type="checkbox" name="act" checked style="width:auto;min-height:0"> Imposta come stagione attiva</label>'),d=>{
  const n=(d.name||'').trim();
  if(!n)return 'Inserisci un nome.';
  if(S.seasons.some(x=>x.name.toLowerCase()===n.toLowerCase()&&(!s||x.id!==s.id)))return 'Esiste già una stagione con questo nome.';
  if(s)s.name=n;else{if(d.act||!S.seasons.length)S.seasons.forEach(x=>x.active=false);S.seasons.push({id:uid(),name:n,active:!!(d.act||!S.seasons.length)})}
  save();render();

 eE:d=>{if(lock(cg()))return toast('Stagione passata: sola lettura.');const g=cg(),e=g.log.find(x=>x.id===d.id),run=()=>eForm(g,e);prev(g,e)?ask('Stai modificando un’azione di un periodo precedente o di una partita chiusa. Continuare?',run,'Continua'):run()},
 eD:d=>{if(lock(cg()))return toast('Stagione passata: sola lettura.');const g=cg(),e=g.log.find(x=>x.id===d.id),run=()=>ask('Eliminare questa azione?',()=>removeEvent(g,e.id),'Elimina');prev(g,e)?ask('Stai eliminando un’azione di un periodo precedente o di una partita chiusa. Continuare?',run,'Continua'):run()},
 out:d=>{const g=cg();g.side[d.s].pl[+d.i].on=false;save();close();render()},
 fs:d=>{const g=cg();g.side[d.s].pl[+d.i].on=true;save();close();render()},
 sw:d=>{const g=cg(),L=g.side[d.s].pl;L[+d.i].on=false;L[+d.n].on=true;save();close();render()},
 undoF:d=>{const g=cg();g.log=g.log.filter(e=>e.id!==d.id);calc(g);g.side[d.s].pl[+d.i].on=true;save();close();render()},
 selp:d=>{const s=d.s,i=+d.i,g=cg();if(g&&g.status==='live'){if(i>=0&&isEx(g,g.side[s].pl[i]))return exAsk(s,i);if(i===-2&&coachEx(g,s))return cxAsk(s)}if(g&&g.status==='live'){if(S.settings.rapid&&UI.arm)apply(UI.arm,s,i);else if(S.settings.pick==='sel'){UI.sel=UI.sel&&UI.sel.s===s&&UI.sel.i===i?null:{s,i};render()}else sheet(s,i)}},
 rb:d=>{const g=cg(),e={id:uid(),q:g.cur,s:d.s,t:'reb',k:d.k};g.log.push(e);save();close();showUndo('Rimbalzo '+(d.k==='o'?'offensivo':'difensivo')+' · '+g.side[d.s].name,e.id)},
 undo:d=>{removeEvent(cg(),d.id)},
 undoLast:()=>{const g=cg();g.log.pop();calc(g);save();close();render()},
 newG:()=>{const m=myTeam();if(!m||!m.players.length)return toast('Aggiungi prima i giocatori della tua squadra.');
  UI.g={opp:'',oppName:'',oppP:[],date:new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16),venue:'home',type:'campionato',season:(seasonA()||{}).id||'',mine:roster12(m.players)};go('setup')},
 ven:d=>{UI.g.venue=d.v;render()},
 tg:d=>{const a=d.k==='m'?UI.g.mine:UI.g.oppP,p=a[d.i];
  if(d.f==='c'){if(!p.c&&cnt(a)>=12)return toast('Massimo 12 convocati.');p.c=!p.c;if(!p.c)p.t=false}
  else{if(!p.t){if(a.filter(x=>x.t).length>=5)return toast('Massimo 5 titolari.');if(!p.c){if(cnt(a)>=12)return toast('Massimo 12 convocati.');p.c=true}}p.t=!p.t}
  render()},
 addNums:()=>{const g=UI.g,v=($('#nums').value||'').split(/[\s,;]+/).filter(Boolean);
  if(!v.length||v.some(x=>!/^\d{1,2}$/.test(x)))return toast('Scrivi numeri da 0 a 99 separati da virgola.');
  v.forEach(n=>{if(!g.oppP.some(p=>p.num===n))g.oppP.push({id:null,num:n,nm:'',c:cnt(g.oppP)<12,t:false,isNew:true})});render()},
 startG:()=>{const g=UI.g;
  if(!g.opp&&!(g.oppName||'').trim())return toast('Scegli o scrivi la squadra avversaria.');
  if(!cnt(g.mine))return toast('Seleziona almeno un convocato della tua squadra.');
  const a=g.mine.filter(p=>p.t).length,b=g.oppP.filter(p=>p.t).length;
  if(a!==5||b!==5)return ask('Titolari: '+a+' per la tua squadra, '+b+' per l’avversaria. Non sono 5: continuare comunque?',mk,'Inizia');
  mk()},
 openG:d=>{UI.gid=d.id;go(cg().status==='done'?'sum':'game')},
 openSum:()=>{UI.box=false;go('sum')},
 box:()=>{UI.box=!UI.box;render()},
 reopen:()=>lock(cg())?toast('Stagione passata: sola lettura.'):ask('Riaprire la partita per modificarla?',()=>{cg().status='live';save();go('game')},'Riapri'),
 print:()=>{try{window.print()}catch(e){}toast('Se non si apre la stampa, funzionerà dopo l’installazione (Giorno 7).')},
 oppT:()=>{S.settings.oppStats=!(S.settings.oppStats!==false);save();render()},
 sub:d=>{const g=cg();if(g.status!=='live')return;const L=g.side[d.s].pl,p=L[+d.i];if(isEx(g,p))return exAsk(d.s,+d.i);if(p.on){p.on=false;save();return render()}if(L.filter(x=>x.on).length<5){p.on=true;save();return render()}
  const m=$('#md');m.innerHTML=`<div class='box'><h3>Entra #${esc(p.num)} ${esc(p.nm)}</h3><p class='mu'>Chi esce?</p>${L.map((x,j)=>x.on?`<div class='it' data-a='sw' data-s='${d.s}' data-i='${j}' data-n='${d.i}' style='border-color:var(--ln)'><span class='num'>${esc(x.num)}</span><b style='flex:1;min-width:0'>${esc(x.nm||'Senza nome')}</b></div>`:'').join('')}<button class='btn' data-a='close'>Annulla</button></div>`;m.style.display='flex'},
 endQ:()=>{const g=cg(),last=g.cur===3+g.ot;
  if(!last)return ask('Chiudere '+pLbl(g.cur)+'?',()=>ask('Confermi di nuovo: passare a '+pLbl(g.cur+1)+'?',()=>{g.cur++;save();render()},'Sì, vai avanti'),'Continua');
  if(g.sc.h===g.sc.a)return ask('Parità: aggiungere un supplementare?',()=>{g.ot++;g.cur++;save();render()},'Aggiungi supplementare');
  ask('Terminare la partita?',()=>{g.status='done';save();go('sum')},'Termina')},
 undoL:()=>{const g=cg();if(!g||g.status!=='live'||!(g.log||[]).length)return;removeEvent(g,g.log[g.log.length-1].id)},
 gv:d=>{UI.gv=d.v;UI.sel=null;render()},
 qk:d=>apply(d.t,d.s,-1),
 prevQ:()=>{const g=cg();if(g.cur<1)return;ask('Tornare a '+pLbl(g.cur-1)+'? Le azioni registrate restano dove sono.',()=>{if(g.cur>3&&g.cur===3+g.ot&&!(g.log||[]).some(e=>e.q===g.cur))g.ot--;g.cur--;save();render()},'Torna indietro')},
 addOT:()=>{const g=cg();ask('Aggiungere un supplementare?',()=>{g.ot++;g.cur=3+g.ot;save();render()})},
 endG:()=>ask('Terminare la partita?',()=>{cg().status='done';save();go('sum')},'Termina'),
 delG:()=>ask('Eliminare questa partita?',()=>{S.games=S.games.filter(x=>x.id!==UI.gid);save();go('home')},'Elimina'),
 enter:()=>{const p=S.settings.pin;if(p&&($('#pin')||{}).value!==p)return toast('PIN errato');LOGGED=true;render()},
 tab:d=>{UI.team=null;if(d.id==='stats'){UI.sc=null;UI.vs=null;UI.sm=null}go(d.id)},
 seSt:d=>{UI.vs=d.id;UI.sc=null;UI.sm=null;go('stats')},
 scat:d=>{UI.sc=d.id||null;go('stats')},
 smode:d=>{UI.sm=d.v||null;render()},
 board:()=>go('board'),
 fscr:()=>{const e=document.documentElement,r=e.requestFullscreen&&e.requestFullscreen();if(r&&r.catch)r.catch(()=>toast('Schermo intero non disponibile qui.'))},
 colRst:()=>{S.settings.c1='#1e8449';S.settings.c2='#ffffff';save();render()},
 setc:d=>{S.settings[d.k]=d.v;save();render()},
 setPin:()=>form('Imposta PIN','<label>PIN di 4 cifre</label><input name="pin" inputmode="numeric" maxlength="4" required>',d=>{if(!/^\d{4}$/.test(d.pin||''))return 'Il PIN deve avere 4 cifre.';S.settings.pin=d.pin;save();render()}),
 rmPin:()=>ask('Rimuovere il PIN?',()=>{delete S.settings.pin;save();render()},'Rimuovi'),
 pick:d=>{UI.team=d.id;render()},
 back:()=>{UI.team=null;render()},
 addTeam:()=>teamForm(),
 editTeam:d=>teamForm(getT(d.id)),
 delTeam:d=>{const t=getT(d.id);ask('Eliminare “'+esc(t.name)+'” e i suoi '+t.players.length+' giocatori?',()=>{S.teams=S.teams.filter(x=>x.id!==t.id);UI.team=null;save();render();toast('Squadra eliminata')},'Elimina')},
 addPl:d=>plForm(getT(d.id)),
 editPl:d=>{const t=getT(d.id);plForm(t,t.players.find(p=>p.id===d.p))},
 delPl:d=>{const t=getT(d.id),p=t.players.find(x=>x.id===d.p);ask('Eliminare il giocatore #'+esc(p.num)+' '+esc(((p.name||'')+' '+(p.surname||'')).trim())+'?',()=>{t.players=t.players.filter(x=>x.id!==p.id);save();render()},'Elimina')},
 addSe:()=>seForm(),
 renSe:d=>seForm(S.seasons.find(s=>s.id===d.id)),
 actSe:d=>ask('Attivare questa stagione? Solo la stagione attiva permette di aggiungere o modificare partite: quella ora attiva diventerà di sola lettura.',()=>{S.seasons.forEach(s=>s.active=s.id===d.id);save();render()},'Attiva'),
 delSe:d=>ask('Eliminare questa stagione?',()=>{S.seasons=S.seasons.filter(s=>s.id!==d.id);save();render()},'Elimina'),
 opt:d=>{S.settings[d.k]=d.v;save();render()},
 rap:(d,b)=>{S.settings.rapid=b.checked;UI.arm=null;save()},
 editProf:()=>form('Modifica nome','<label>Il tuo nome</label><input name="coach" required maxlength="40" value="'+esc(S.profile.coach)+'">',d=>{const n=(d.coach||'').trim();if(!n)return 'Inserisci un nome.';S.profile.coach=n;save();render()}),
 bkup:()=>{
  const txt=JSON.stringify({v:S.v,profile:S.profile,seasons:S.seasons,teams:S.teams,games:S.games,settings:S.settings});
  const ta=$('#bk');ta.value=txt;ta.select();
  S.settings.lastBackup=Date.now();save();
  try{navigator.clipboard.writeText(txt).then(()=>toast('Backup copiato. Incollalo in un luogo sicuro.'),()=>toast('Seleziona il testo e copialo a mano.'))}catch(e){toast('Seleziona il testo e copialo a mano.')}
 },
 rest:()=>{
  let o;try{o=JSON.parse($('#rs').value)}catch(e){return toast('Il testo incollato non è un backup valido.')}
  const er=validateBackup(o);if(er)return toast(er);$('#bk').value=JSON.stringify(S);
  ask('Il ripristino sostituisce tutti i dati su questo dispositivo. Il backup dello stato attuale è stato messo nella casella Backup qui sopra: copialo prima di continuare. Continuare?',()=>{const prev=S,pu=UI;const nx=Object.assign(def(),o);nx.settings=Object.assign(def().settings,o.settings);S=nx;if(!save()){S=prev;UI=pu;return toast('Ripristino non riuscito: i dati non sono stati caricati.')}UI={tab:'home',team:null,q:''};render();toast('Dati ripristinati')},'Ripristina');
 },
 wipe:()=>ask('Verranno cancellati profilo, squadre, giocatori e stagioni. L’operazione non si può annullare.',()=>{S=def();UI={tab:'home',team:null,q:''};try{localStorage.removeItem(KEY)}catch(e){}render()},'Cancella tutto')
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const f=A[b.dataset.a];if(f)f(b.dataset,b)});
document.addEventListener('input',e=>{if(e.target.id==='q'){UI.q=e.target.value;$('#tl').innerHTML=teamList()}});
document.addEventListener('submit',e=>{
 if(e.target.id==='rg'){e.preventDefault();const n=(new FormData(e.target).get('coach')||'').trim();if(!n)return;S.profile=Object.assign(S.profile||{},{coach:n});LOGGED=true;save();render();return}
 if(e.target.id!=='ob')return;e.preventDefault();
 const d=Object.fromEntries(new FormData(e.target));
 const t={id:uid(),name:d.team.trim(),mine:true,players:[],coaches:[d.c1,d.c2,d.c3].map(x=>(x||'').trim())};
 S.teams=[t];S.seasons=[{id:uid(),name:d.season.trim(),active:true}];
 UI={tab:'teams',team:t.id,q:''};save();render();
});
['input','change'].forEach(ev=>document.addEventListener(ev,e=>{const k=e.target.dataset&&e.target.dataset.g;if(!k||!UI.g)return;UI.g[k]=e.target.value;if(ev==='change'&&k==='opp'){loadOpp();render()}}));
document.addEventListener('change',e=>{const k=e.target.dataset&&e.target.dataset.f;if(k){UI[k]=e.target.value;render()}const c=e.target.dataset&&e.target.dataset.c;if(c){S.settings[c]=e.target.value;save();render()}});
let DR=null;
const clr=()=>document.querySelectorAll('.dz').forEach(x=>x.classList.remove('dz'));
const tgt=e=>{const t=document.elementFromPoint(e.clientX,e.clientY);return t&&t.closest('[data-s][data-i]')};
document.addEventListener('pointerdown',e=>{const c=e.target.closest('[data-st]');if(c)DR={t:c.dataset.st,x:e.clientX,y:e.clientY,mv:false,gh:null,el:c}});
document.addEventListener('pointermove',e=>{
 if(!DR)return;
 if(!DR.mv&&Math.hypot(e.clientX-DR.x,e.clientY-DR.y)<10)return;
 DR.mv=true;
 if(!DR.gh){DR.gh=DR.el.cloneNode(true);DR.gh.style.cssText='position:fixed;pointer-events:none;z-index:40;opacity:.9';document.body.appendChild(DR.gh)}
 DR.gh.style.left=e.clientX-40+'px';DR.gh.style.top=e.clientY-40+'px';
 clr();const r=tgt(e);if(r)r.classList.add('dz');
});
document.addEventListener('pointerup',e=>{
 if(!DR)return;const d=DR;DR=null;if(d.gh)d.gh.remove();clr();
 if(d.mv){const r=tgt(e);if(r)apply(d.t,r.dataset.s,+r.dataset.i)}
 else if(S.settings.rapid){UI.arm=UI.arm===d.t?null:d.t;render()}
 else if(UI.sel)apply(d.t,UI.sel.s,UI.sel.i);
 else toast('Tocca un giocatore per scegliere l’azione, oppure trascina il tasto su di lui.');
});
document.addEventListener('pointercancel',()=>{if(DR){if(DR.gh)DR.gh.remove();clr();DR=null}});
render();
})();
</script>
<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js")</script></body>
